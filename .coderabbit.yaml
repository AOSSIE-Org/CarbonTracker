# Enables IDE autocompletion for this config file
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Language for CodeRabbit's review comments
language: en

# Enable experimental features (currently not using any specific early_access features)
early_access: true

chat:
  # CodeRabbit will automatically respond to @coderabbitai mentions in PR comments
  auto_reply: true

issue_enrichment:
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: Issues reporting bugs, errors, crashes, incorrect behavior, or unexpected results. This includes runtime errors, logic errors, broken functionality, regressions, and any deviation from expected or documented behavior.
      - label: enhancement
        instructions: Feature requests, improvements to existing functionality, performance optimizations, refactoring suggestions, UI/UX enhancements, and any suggestions to make the project better or add new capabilities.
      - label: documentation
        instructions: Documentation updates, additions, corrections, or clarifications needed. This includes missing docs, outdated information, unclear instructions, API documentation, code examples, README improvements, and any requests for better explanations or guides.
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - "plan-me" # Auto-plan issues with this label
        - "feature" # Also auto-plan these
        - "!no-plan" # Never auto-plan issues with this label

reviews:
  profile: assertive # Options: chill (focuses on significant issues, less nitpicky about style), assertive (more thorough, flags style issues and minor improvements too)

  auto_review:
    # Automatically trigger reviews when PRs are opened or updated
    enabled: true
    # Skip auto-review if PR title contains these keywords
    ignore_title_keywords:
      - "WIP"
    # Don't auto-review draft PRs
    drafts: false
    # Only auto-review PRs targeting these branches
    base_branches:
      - main
      - develop

  # Include a high-level summary at the start of each review
  high_level_summary: true

  # Generate sequence diagrams for complex code flows
  sequence_diagrams: true

  # Include poems in reviews
  poem: false

  # Show review completion status
  review_status: true

  # Keep the walkthrough section expanded by default
  collapse_walkthrough: false

  # Include summary of all changed files
  changed_files_summary: true

  # Automatically request changes on the PR (just leave comments)
  request_changes_workflow: true

  # Pre-merge checks to enforce before merging PRs
  pre_merge_checks:
    description:
      # Validate that PR has a proper description
      mode: warning # Options: off, warning, error
    docstrings:
      # Disable docstring coverage checks (let's assume we don't need them)
      mode: off

  # Exclude these paths from reviews (build artifacts and dependencies)
  path_filters:
    - "!**/node_modules/**" # npm dependencies
    - "!**/android/**" # Native Android build files
    - "!**/ios/**" # Native iOS build files
    - "!**/.dart_tool/**"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"

  # Use the following tools when reviewing
  tools:
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

  # Apply the following labels to PRs
  labeling_instructions:
    - label: Dart
      instructions: >
        Apply when the PR contains changes to Dart source code.
    - label: Flutter
      instructions: >
        Apply when the PR contains changes to Flutter application code.
    - label: Documentation
      instructions: >
        Apply whenever project documentation (namely markdown source-code) is
        updated by the PR/MR
    - label: Linter
      instructions: >
        Apply when the purpose of the PR/MR is related to fixing the feedback
        from a linter

  # Review instructions that apply to all files
  instructions: >-
    Review the code primarily for correctness, reliability, security, maintainability,
    and consistency with the existing CarbonTracker architecture.
    Prioritize real bugs and meaningful issues over stylistic preferences.
    Do not suggest unnecessary rewrites, architectural changes, or refactoring
    unless there is a concrete benefit.
    Avoid comments about personal coding preferences when the existing implementation
    is valid and consistent with the project.

    Check for:
        - Incorrect behavior and regressions
        - Null-safety problems
        - Async/concurrency issues and race conditions
        - Resource leaks and improper cleanup
        - Error handling and failure states
        - Data consistency
        - Security and privacy issues
        - Meaningful performance problems
        - Code duplication
        - Missing tests for important behavior

        Do not require tests for trivial UI changes, simple constants, boilerplate,
        or changes where testing would provide little value.
        Do not request copyright-year changes unless the project explicitly requires
        them.

        Keep comments concise and actionable.
        Do not suggest adding comments when the code is already self-explanatory.

  # Custom review instructions for specific file patterns
  path_instructions:
    # Review Dart code in the lib directory with a focus on Flutter best practices and Riverpod state management.
    - path: "lib/**/*.dart"
      instructions: >
        Review this as Flutter/Dart code.
        Prioritize:
        - Dart null safety
        - Async/await correctness
        - Race conditions
        - State-management correctness
        - Widget lifecycle issues
        - Build/rebuild performance
        - Error and loading states
        - Accessibility where relevant
        - Maintainability
        - Consistency with existing project architecture

        For Riverpod code:
        - Check provider lifecycle and disposal behavior.
        - Check whether ref.watch and ref.read are used appropriately.
        - Look for unnecessary rebuilds.
        - Look for race conditions between asynchronous provider operations.
        - Ensure state is updated consistently after database mutations.

        Avoid recommending architectural rewrites unless there is a concrete
        correctness, reliability, or maintainability problem.

    # Review database-related Dart code with a focus on correctness, data integrity, and concurrency.

    - path: "lib/**/*database*.dart"
      instructions: >
        Pay particular attention to SQLite/database correctness.

        Check:

        - Schema consistency
        - Queries and filtering
        - Transactions
        - Data integrity
        - Duplicate records
        - Concurrent database operations
        - Error handling
        - Monthly trip-reset behavior
        - Correct handling of deleted data

        Do not suggest changing the database architecture without a concrete
        technical reason.

    # Review service-layer Dart code with a focus on API correctness, error handling, and async behavior.

    - path: "lib/**/*service*.dart"
      instructions: >
        Pay particular attention to service-layer correctness.

        Check:
        - API failures
        - Permission handling
        - Async operations
        - Error handling
        - Resource cleanup
        - Rate limiting
        - Invalid or unavailable external data
        - Network failure behavior

    # Review mapping and geolocation Dart code with a focus on correctness, privacy, and reliability.

    - path: "lib/**/*location*.dart"

      instructions: >
        Review map and location functionality carefully.

        Check:
        - Location permission handling
        - Failure when location services are unavailable
        - Geolocation errors
        - Reverse-geocoding failures
        - External API rate limits
        - Incorrect distance calculations
        - Unnecessary repeated geocoding requests
        - Privacy implications of location data

        Do not recommend replacing the mapping/geocoding architecture unless
        there is a concrete correctness, privacy, reliability, or performance issue.

    # Review health-data integration Dart code with a focus on correctness, permissions, and async behavior.

    - path: "lib/**/*health*.dart"
      instructions: >
        Review health-data integration carefully.

        Check:
        - Permission handling
        - Missing or unavailable health data
        - Async behavior
        - Loading and error states
        - Platform-specific behavior
        - Incorrect aggregation of health metrics
        - Unnecessary repeated health-data queries

    # Review test files for meaningful behavioral coverage, prioritizing important logic, database behavior, and edge cases.

    - path: "test/**/*.dart"
      instructions: >

        Review Dart and Flutter tests for meaningful behavioral coverage.

        Prioritize:

        - Important application logic
        - Database behavior
        - Carbon calculations
        - Provider state transitions
        - Error cases
        - Edge cases
        - Async behavior

        Do not demand tests for trivial UI or boilerplate.

    # Review Android native code for meaningful issues related to Flutter integration, permissions, manifests, Gradle configuration, services, or security.

    - path: "android/**"
      instructions: >
        Only flag meaningful issues related to Flutter Android integration,
        permissions, manifests, Gradle configuration, services, or security.
        Avoid unnecessary native-platform refactoring.

    # Review iOS native code for meaningful issues related to Flutter integration, permissions, Info.plist configuration, platform capabilities, or security.

    - path: "ios/**"
      instructions: >
        Only flag meaningful issues related to Flutter iOS integration,
        permissions, Info.plist configuration, platform capabilities, or security.
        Avoid unnecessary native-platform refactoring.

    # Review documentation files for correctness, clarity, consistency with the actual application, and broken or misleading instructions.

    - path: "**/*.md"
      instructions: >
        Check documentation for correctness, clarity, consistency with the
        actual application, and broken or misleading instructions.


    # Review privacy policy files for accuracy regarding data collection, storage, processing, deletion, export, permissions, and third-party services.

    - path: "PRIVACY.md"
      instructions: >
        Pay particular attention to whether the privacy policy accurately
        describes the application's actual data collection, storage, processing,
        deletion, export, permissions, and third-party services.

        Do not invent privacy practices that are not supported by the code.
